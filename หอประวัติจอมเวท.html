<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scratch Adventure — หอประวัติจอมเวท</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:var(--font);background:#bfefff url('profile-bg.png') center/cover fixed no-repeat;color:var(--ink)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(8,73,132,.20));pointer-events:none;z-index:-1}
.shell{width:min(1120px,94vw);margin:auto;padding:22px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo-cat{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb02e,#ff6f3d);font-size:27px;box-shadow:0 5px 0 #dc8330}.logo{font-size:25px;font-weight:800;color:#1268d7;text-shadow:0 2px #fff}.logo span{color:#f29c13}.actions{display:flex;gap:9px}.small-btn{border:0;border-radius:999px;padding:10px 16px;background:rgba(255,255,255,.9);color:#315b88;font-weight:800;box-shadow:0 5px 15px rgba(45,86,130,.12);cursor:pointer}
.card{background:rgba(255,255,255,.91);border:2px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 18px 45px rgba(34,74,125,.22);backdrop-filter:blur(12px)}
.profile{display:grid;grid-template-columns:310px 1fr;gap:18px}.portrait{padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.avatar{width:180px;height:180px;border-radius:48px;display:grid;place-items:center;font-size:105px;background:linear-gradient(145deg,#dff7ff,#9bdcff);border:6px solid #fff;box-shadow:0 14px 30px rgba(42,114,181,.22);position:relative}.avatar:after{content:"";position:absolute;right:-6px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#31c86b;border:5px solid white}.class-pill{margin-top:14px;background:linear-gradient(135deg,#8b4de8,#5b36c9);color:#fff;padding:7px 15px;border-radius:999px;font-weight:800}.portrait h2{margin:14px 0 2px;color:#173c8f;font-size:25px}.student-id{color:#7187a2;font-size:14px}
.details{padding:26px}.eyebrow{color:#f29c13;font-weight:800;letter-spacing:.4px}.details h1{margin:3px 0 16px;color:#173c8f;font-size:32px}.level-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}.level{background:linear-gradient(135deg,#8b4de8,#5b36c9);color:#fff;border-radius:999px;padding:6px 13px;font-weight:800}.xp{font-weight:800;color:#426589}.progress{height:18px;background:#e7f0f8;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(53,91,137,.08)}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#35bdf5,#167de5,#8b4de8);border-radius:999px;transition:.4s}.progress-label{font-size:13px;color:#69809e;margin-top:5px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.info{padding:15px 16px;border-radius:18px;background:linear-gradient(145deg,#fff,#f1f8ff);border:1px solid #e1edf8}.info span{display:block;color:#7187a2;font-size:13px}.info strong{display:block;color:#315b88;font-size:18px;margin-top:2px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 0 10px}.section-title h2{margin:0;color:#173c8f}.section-title span{font-size:13px;color:#69809e}.missions{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.mission{padding:18px;min-height:175px}.mi{font-size:38px}.mission h3{margin:7px 0 2px;color:#23446e;font-size:17px}.mission small{color:#7187a2;line-height:1.4;display:block;min-height:39px}.status{display:inline-flex;margin-top:12px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.done{background:#e5faed;color:#168249}.doing{background:#fff5d9;color:#b87900}.locked{background:#eef2f7;color:#718096}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.badge-card{padding:17px;text-align:center}.badge-icon{font-size:43px;filter:drop-shadow(0 5px 5px rgba(0,0,0,.08))}.badge-card h3{font-size:15px;margin:7px 0 2px;color:#315b88}.badge-card small{color:#7187a2}.earned{background:linear-gradient(145deg,#fffdf1,#fff7cf)}.footer{text-align:center;color:#fff;font-size:12px;text-shadow:0 2px 4px rgba(0,0,0,.35);margin-top:20px}
@media(max-width:850px){.profile{grid-template-columns:1fr}.missions,.badges{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.shell{width:92vw}.topbar{align-items:flex-start}.logo{font-size:19px}.actions .small-btn{padding:8px 10px}.actions .map-label{display:none}.details{padding:20px}.details h1{font-size:27px}.info-grid{grid-template-columns:1fr}.missions,.badges{grid-template-columns:1fr}}
</style>
<script src="js/api.js"></script><script src="js/auth.js"></script></head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="logo-cat">🐱</div><div class="logo"><span>SCRATCH</span> ADVENTURE</div></div><div class="actions"><button class="small-btn map-label" onclick="go('แผนที่อาณาจักรเวทมนตร์.html')">🗺️ แผนที่</button><button class="small-btn" onclick="go('ห้องบัญชาการนักผจญภัย.html')">🏠 ห้องบัญชาการ</button></div></header>
<section class="profile">
<article class="card portrait"><div class="avatar" id="avatar">🧙‍♂️</div><div class="class-pill" id="classPill">นักเรียน</div><h2 id="name">นักผจญภัย</h2><div class="student-id">รหัสนักเรียน: <b id="studentId">—</b></div></article>
<article class="card details"><div class="eyebrow">🧙 หอประวัติจอมเวท</div><h1>ประวัตินักผจญภัย</h1><div class="level-row"><span class="level" id="level">LEVEL 1</span><span class="xp" id="xp">0 XP</span></div><div class="progress"><div id="progressBar"></div></div><div class="progress-label" id="progressLabel">ความก้าวหน้า 0%</div><div class="info-grid"><div class="info"><span>🏫 ชั้นเรียน</span><strong id="className">—</strong></div><div class="info"><span>✨ Level</span><strong id="levelInfo">1</strong></div><div class="info"><span>⭐ XP สะสม</span><strong id="xpInfo">0 XP</strong></div><div class="info"><span>📜 ภารกิจที่ผ่าน</span><strong id="missionInfo">0 / 4</strong></div></div></article>
</section>
<div class="section-title"><h2>📜 สถานะภารกิจ</h2><span>Mission Status</span></div>
<section class="missions" id="missions"></section>
<div class="section-title"><h2>🏅 ตราเกียรติยศ</h2><span>Badge Collection</span></div>
<section class="badges" id="badges"></section>
<div class="footer">Scratch Adventure • Code Realm • หอประวัติจอมเวท</div>
</main>
<script>
(async()=>{const p=requireAuth();if(!p)return;const latest=await refreshStudent();const st=latest||currentStudent();saveSession(st);const set=(id,v)=>document.getElementById(id).textContent=v;set('name',st.name||'นักผจญภัย');set('studentId',st.student_id||'—');set('className',st.class||'—');set('classPill',st.class||'นักเรียน');const lv=Number(st.level)||1,xp=Number(st.xp)||0,pr=Math.round((Number(st.progress)||0)*100);set('level','LEVEL '+lv);set('levelInfo',lv);set('xp',xp+' XP');set('xpInfo',xp+' XP');set('progressLabel','ความก้าวหน้า '+pr+'%');document.getElementById('progressBar').style.width=pr+'%';const ms=[['⚡','Mission 1: Sequence','mission1'],['🏰','Mission 2: Selection','mission2'],['🌲','Mission 3: Iteration','mission3'],['👾','Final Quest / Final Boss','final_boss']];set('missionInfo',ms.filter(x=>entered(st[x[2]])).length+' / 4');document.getElementById('missions').innerHTML=ms.map((m,i)=>{const d=entered(st[m[2]]),u=i===0||entered(st[ms[i-1][2]]);return `<article class="card mission"><div class="mi">${m[0]}</div><h3>${m[1]}</h3><small>${['หมู่บ้านเวทลำดับ · เรียงบล็อก Scratch','ปราสาทมนตราแห่งเงื่อนไข · if / else','พงไพรมนตราวนซ้ำ · Loop / Repeat','ประตูจอมเวทโปรแกรม · บูรณาการทุกทักษะ'][i]}</small><span class="status ${d?'done':u?'doing':'locked'}">${d?'✅ พิชิตแล้ว':u?'🟡 พร้อมทำภารกิจ':'🔒 ยังไม่ปลดล็อก'}</span></article>`}).join('');const bs=['⚡','🛡️','🌲','👑'],names=['Sequence Master','Logic Knight','Loop Ranger','Program Legend'];const b=String(st.badge||'').toLowerCase();document.getElementById('badges').innerHTML=names.map((n,i)=>{const e=b.includes(n.toLowerCase());return `<article class="card badge-card ${e?'earned':''}"><div class="badge-icon">${bs[i]}</div><h3>${['จอมเวทแห่งลำดับ','อัศวินแห่งตรรกะ','ผู้พิทักษ์แห่งการวนซ้ำ','ตำนานจอมเวทโปรแกรม'][i]}</h3><small>${e?'✅ ได้รับแล้ว':'ยังไม่ได้รับ'}</small></article>`}).join('');})();
</script></body></html>
