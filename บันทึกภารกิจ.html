<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scratch Adventure — Code Realm</title><link rel="stylesheet" href="theme.css"><script src="js/api.js"></script><script src="js/auth.js"></script><style>body{background:#bfefff url("code-realm-login-bg.png") center/cover fixed no-repeat}.wrap{width:min(1120px,94vw);margin:auto;padding:20px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:25px;font-weight:800;color:#1268d7;text-shadow:0 2px #fff}.brand span{color:#f29c13}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.9);color:#315b88;text-decoration:none;font-weight:800;border:0}.hero{text-align:center;margin:20px 0}.hero h1{color:#173c8f;font-size:36px;text-shadow:0 3px #fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{padding:24px;background:rgba(255,255,255,.92);border-radius:28px;border:2px solid #fff;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.item{margin:10px 0;padding:14px;border-radius:16px;background:#f5fbff;border:1px solid #dceefe}.item b{color:#173c8f}.footer{text-align:center;color:white;text-shadow:0 2px 4px #345;margin-top:24px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:28px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><span>SCRATCH</span> ADVENTURE</div><nav class="nav"><a href="ห้องบัญชาการนักผจญภัย.html">🏠 ห้องบัญชาการ</a><a href="แผนที่อาณาจักรเวทมนตร์.html">🗺️ แผนที่</a><a href="หอประวัติจอมเวท.html">🧙 ประวัติ</a><a href="หอเกียรติยศจอมเวท.html">🏆 หอเกียรติยศ</a></nav></header><section class="hero"><div class="badge-pill">📖 MISSION LOG</div><h1>บันทึกภารกิจ</h1><p>คัมภีร์บันทึกการเดินทางของนักผจญภัย</p></section><section class="card" id="log">กำลังโหลด...</section><div class="footer">Scratch Adventure • Code Realm</div></main><script>(async()=>{const p=requireAuth();if(!p)return;const s=await refreshStudent()||currentStudent();const rows=[['⚡','Mission 1 · Sequence','mission1'],['🏰','Mission 2 · Selection','mission2'],['🌲','Mission 3 · Iteration','mission3'],['👾','Final Quest · Programmer’s Gate','final_boss']];document.getElementById('log').innerHTML=rows.map(r=>`<div class="item"><b>${r[0]} ${r[1]}</b><br>${entered(s[r[2]])?'คะแนน '+s[r[2]]+'/10 · บันทึกใน Code Realm':'ยังไม่บันทึกคะแนน'}</div>`).join('')})();</script></body></html>
